org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
flutter.impellerEnabled=false
android.useAndroidX=true
android.enableJetifier=true

# Unity export properties
unityStreamingAssets=

# Unity が参照する SDK/NDK パスは local.properties に書く（gitignore済み・各開発環境で別物）。
# 例（Mac）:
#   sdk.dir=/Users/xxx/Library/Android/sdk
#   unity.androidNdkPath=/Applications/Unity/Hub/Editor/6000.4.4f1/PlaybackEngines/AndroidPlayer/NDK
# トップレベル build.gradle.kts が local.properties を読んでサブプロジェクトに注入する。
